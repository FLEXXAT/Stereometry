<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Стереометрия — конструктор сечений</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=PT+Serif:ital,wght@1,400;1,700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <aside>
      <h1>
        Конструктор сечений<span
          >Стереометрия: точки, прямые, параллели и сечения многогранников</span
        >
      </h1>

      <section>
        <h2>Фигура</h2>
        <div class="shapes" id="shapes"></div>
      </section>

      <section>
        <h2>Размеры</h2>
        <div id="params"></div>
      </section>

      <section>
        <h2>Отображение</h2>
        <div class="toggles">
          <label
            ><input type="checkbox" data-opt="hidden" checked /> Невидимые рёбра пунктиром</label
          >
          <label><input type="checkbox" data-opt="faces" checked /> Заливка граней</label>
          <label><input type="checkbox" data-opt="labels" checked /> Подписи точек</label>
          <label><input type="checkbox" data-opt="ortho" checked /> Параллельная проекция</label>
          <label><input type="checkbox" data-opt="snap" checked /> Привязка к серединам</label>
          <label><input type="checkbox" data-opt="isnap" checked /> Привязка к пересечениям</label>
          <label><input type="checkbox" data-opt="ratio" /> Делить отрезок в отношении</label>
          <div class="ratio">
            <input type="number" id="rm" min="1" max="20" value="1" aria-label="m" />
            <span>:</span>
            <input type="number" id="rn" min="1" max="20" value="2" aria-label="n" />
            <small style="color: var(--text2)">от ближнего конца</small>
          </div>
        </div>
      </section>

      <section>
        <h2>Построения</h2>
        <div id="objs"></div>
      </section>

      <div class="actions">
        <button class="minibtn" id="undo">Отменить</button>
        <button class="minibtn" id="clear">Очистить всё</button>
        <button class="minibtn" id="resetView">Сбросить вид</button>
      </div>
    </aside>

    <main id="wrap">
      <canvas id="cv"></canvas>
      <div class="toolbar" id="toolbar" role="toolbar" aria-label="Инструменты"></div>
      <div class="hint" id="hint"></div>
      <div class="corner">
        <button id="zin" title="Приблизить" aria-label="Приблизить">+</button>
        <button id="zout" title="Отдалить" aria-label="Отдалить">−</button>
        <button id="undo2" title="Отменить (Ctrl+Z)" aria-label="Отменить">
          <svg viewBox="0 0 24 24">
            <path d="M9 14 4 9l5-5" />
            <path d="M4 9h11a5 5 0 0 1 0 10h-3" />
          </svg>
        </button>
      </div>
      <div class="toast" id="toast"></div>
    </main>

    <script type="module" src="js/app.js"></script>
  </body>
</html>
